<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>초등 리딩런 프로그램</title>
    <style>
        body { font-family: 'Malgun Gothic', sans-serif; text-align: center; background-color: #f4f7f6; padding: 20px; }
        h1 { color: #333; }
        #timer { font-size: 32px; font-weight: bold; color: #ff4757; margin: 10px; }
        #text-container { max-width: 800px; margin: 20px auto; padding: 30px; background: white; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); line-height: 2; font-size: 28px; text-align: left; word-break: break-all; }
        .word { display: inline-block; margin-right: 8px; color: #7f8c8d; transition: all 0.2s; }
        .highlight { background-color: #fff200; color: #000; font-weight: bold; border-radius: 4px; padding: 0 4px; }
        button { font-size: 20px; padding: 12px 30px; margin: 10px; border: none; border-radius: 8px; cursor: pointer; font-weight: bold; }
        #start-btn { background-color: #2ed573; color: white; }
        #result-box { display: none; font-size: 36px; font-weight: bold; color: #1e90ff; margin-top: 20px; background: #e1f5fe; padding: 20px; border-radius: 8px; display: inline-block; }
    </style>
</head>
<body>

    <h1>🏃‍♂️ 우리 반 AI 리딩런 (Reading Run) 🏃‍♀️</h1>
    <div id="timer">제한시간: 15:00</div>
    
    <button id="start-btn" onclick="startGame()">게임 시작!</button>
    <br>
    <div id="result-box" style="display:none;"></div>

    <!-- 💡 아래의 문장들을 학교 행사에 맞게 수정하시면 됩니다. 띄어쓰기 기준으로 블럭이 이동합니다. -->
    <div id="text-container"></div>

    <script>
        // 행사에 사용할 본문 텍스트 (아이들이 읽을 책 내용으로 자유롭게 바꾸세요)
        const sampleText = "어린 왕자는 다른 별을 여행하기 시작했습니다. 첫 번째 별에는 왕이 살고 있었습니다. 왕은 화려한 옷을 입고 커다란 의자에 앉아 있었습니다. 누군가 찾아온 것을 보고 왕은 매우 기뻐했습니다. 독서는 마음의 양식입니다. 우리는 책을 읽으며 더 넓은 세상을 만나고 멋진 꿈을 꿀 수 있습니다. 지혜를 모아 열심히 달려봅시다.";
        
        const words = sampleText.split(" ");
        let currentWordIndex = 0;
        let totalCharacters = 0;
        let timeLeft = 60; // 💡 제한시간 설정 (초 단위, 현재 60초)
        let timerInterval;
        let recognition;

        // 화면에 문장 배치
        const container = document.getElementById("text-container");
        words.forEach((word, index) => {
            const span = document.createElement("span");
            span.innerText = word;
            span.className = "word";
            span.id = "word-" + index;
            container.appendChild(span);
        });

        // 음성인식 세팅 (크롬 표준 기능 사용)
        if ('webkitSpeechRecognition' in window) {
            recognition = new webkitSpeechRecognition();
            recognition.continuous = true;
            recognition.interimResults = true;
            recognition.lang = 'ko-KR';

            recognition.onresult = function(event) {
                let interimTranscript = '';
                for (let i = event.resultIndex; i < event.results.length; ++i) {
                    if (!event.results[i].isFinal) {
                        interimTranscript += event.results[i][0].transcript;
                    }
                }
                
                // 말한 단어가 화면의 단어와 유사한지 실시간 비교
                if (interimTranscript.trim().length > 0) {
                    let spoken = interimTranscript.trim().replace(/ /g, "");
                    let targetWord = words[currentWordIndex].replace(/[.,\/#!\$%\^&\*;:{}=\-_`~()]/g,"");
                    
                    if (spoken.includes(targetWord) || targetWord.includes(spoken)) {
                        highlightWord(currentWordIndex);
                        currentWordIndex++;
                    }
                }
            };
        } else {
            alert("크롬(Chrome) 브라우저에서만 작동하는 프로그램입니다.");
        }

        function startGame() {
            document.getElementById("start-btn").style.display = "none";
            document.getElementById("result-box").style.display = "none";
            currentWordIndex = 0;
            totalCharacters = 0;
            timeLeft = 60; // 시간 초기화
            
            // 하이라이트 초기화
            document.querySelectorAll('.word').forEach(el => el.className = 'word');

            // 타이머 작동
            timerInterval = setInterval(() => {
                timeLeft--;
                let mins = String(Math.floor(timeLeft / 60)).padStart(2, '0');
                let secs = String(timeLeft % 60).padStart(2, '0');
                document.getElementById("timer").innerText = `제한시간: ${mins}:${secs}`;

                if (timeLeft <= 0) {
                    endGame();
                }
            }, 1000);

            // 음성인식 시작
            recognition.start();
        }

        function highlightWord(index) {
            if (index < words.length) {
                const el = document.getElementById("word-" + index);
                el.classList.add("highlight");
                // 공백 제외 글자 수 누적 계산
                totalCharacters += words[index].length; 
            }
        }

        function endGame() {
            clearInterval(timerInterval);
            recognition.stop();
            document.getElementById("timer").innerText = "게임 종료!";
            document.getElementById("start-btn").style.display = "inline-block";
            document.getElementById("start-btn").innerText = "다시 도전하기";
            
            // 결과 화면 표시 (글자 수를 거리로 환산)
            const resultBox = document.getElementById("result-box");
            resultBox.style.display = "inline-block";
            resultBox.innerHTML = `🏁 최종 달린 거리: ${totalCharacters} m (${totalCharacters} 글자 통과!)`;
        }
    </script>
</body>
</html>
